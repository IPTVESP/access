<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Accesos</title>
    <style>
        body { background-color: #0f1115; color: #e0e0e0; font-family: sans-serif; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .card { background-color: #1e222b; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; border: 1px solid #2d323c; box-sizing: border-box; margin-top: 20px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #2d323c; padding-bottom: 15px; }
        .plan-name { font-weight: bold; font-size: 1.2em; }
        .expira { color: #f5b041; font-weight: bold; }
        .section-title { color: #f5b041; font-size: 1.1em; margin-top: 25px; border-left: 3px solid #f5b041; padding-left: 10px; font-weight: bold;}
        .subtitle { font-size: 0.8em; color: #888; margin-bottom: 10px; }
        .field { margin-top: 10px; }
        .field label { display: block; font-size: 0.8em; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .field input { width: 100%; background-color: #14181f; border: 1px solid #2d323c; color: #fff; padding: 12px; border-radius: 6px; font-family: monospace; box-sizing: border-box; cursor: pointer; transition: border 0.2s;}
        .field input:hover { border-color: #f5b041; }
        .alt-box { background-color: #1e222b; border: 1px solid #2d323c; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .alt-text { font-size: 0.85em; color: #ccc; margin-top: 0; margin-bottom: 10px; line-height: 1.4;}
        .alt-label { color: #f5b041; font-size: 0.8em; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 5px;}
        .alt-url { display: block; color: #4a90e2; font-family: monospace; margin-bottom: 5px; cursor: pointer; background-color: rgba(74, 144, 226, 0.1); padding: 4px 6px; border-radius: 4px; width: fit-content;}
        .alt-url:hover { background-color: rgba(74, 144, 226, 0.2); }
        .error-container { text-align: center; padding: 40px 20px; }
        .error-logo { color: #f5b041; font-size: 1.4em; font-weight: 900; letter-spacing: 2px; margin-bottom: 30px; }
        .error-title { color: #ffffff; font-size: 2em; font-weight: bold; margin-bottom: 15px; }
        .error-subtitle { color: #a0a0a0; font-size: 1em; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card" id="app">
        <p style="text-align:center;">Cargando accesos...</p>
    </div>

    <script>
        // 🔥 PEGA AQUÍ TU CLAVE REAL (la que empieza por oh5...)
        const CLAVE_SECRETA = 'oh5eQeGdwAXR1Ci2wisjM2FSO3cF0LpuqwufjPT0I4k=';

        // Función nativa para convertir de Base64Url a Bytes
        function base64UrlToBytes(base64Url) {
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) { base64 += '='; }
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        async function descifrarFernet(token, claveStr) {
            try {
                // 1. Decodificar el token y la clave de Base64Url
                const tokenBytes = base64UrlToBytes(token);
                const claveBytes = base64UrlToBytes(claveStr);

                if (tokenBytes.length < 73) throw new Error("Token demasiado corto");

                // 2. Extraer partes del token Fernet (Versión, Timestamp, IV, Ciphertext, HMAC)
                const iv = tokenBytes.slice(9, 25);
                const ciphertext = tokenBytes.slice(25, tokenBytes.length - 32);
                const hmac = tokenBytes.slice(tokenBytes.length - 32);
                
                // 3. Separar la clave en Signing Key (primeros 16 bytes) y Encryption Key (últimos 16 bytes)
                const signingKey = claveBytes.slice(0, 16);
                const encryptionKey = claveBytes.slice(16, 32);

                // 4. Verificar la firma HMAC (Seguridad)
                const keyHmac = await crypto.subtle.importKey(
                    "raw", signingKey, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]
                );
                const dataToVerify = tokenBytes.slice(0, tokenBytes.length - 32);
                const isValid = await crypto.subtle.verify("HMAC", keyHmac, hmac, dataToVerify);
                
                if (!isValid) throw new Error("Firma inválida (la clave no coincide o el enlace fue alterado)");

                // 5. Descifrar los datos (AES-CBC)
                const keyAes = await crypto.subtle.importKey(
                    "raw", encryptionKey, { name: "AES-CBC" }, false, ["decrypt"]
                );
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-CBC", iv: iv }, keyAes, ciphertext
                );

                // 6. Convertir a texto y luego a JSON
                const decoder = new TextDecoder();
                const jsonString = decoder.decode(decryptedBuffer);
                return JSON.parse(jsonString);

            } catch (e) {
                console.error("Error de descifrado:", e);
                return null;
            }
        }

        async function init() {
            const hash = window.location.hash.substring(1);
            
            if (!hash) { 
                renderError("No se ha encontrado ningún código en el enlace."); 
                return; 
            }

            // Intentar descifrar usando la API nativa
            const datos = await descifrarFernet(hash, CLAVE_SECRETA);

            if (datos) {
                renderPanel(datos);
            } else {
                renderError("La clave secreta del HTML no coincide con la del script de Python, o el enlace está caducado.");
            }
        }

        function renderError(mensajeDebug = "") {
            const app = document.getElementById('app');
            app.style.backgroundColor = 'transparent';
            app.style.border = 'none';
            app.innerHTML = `
                <div class="error-container">
                    <div class="error-logo">STRONG 8K</div>
                    <div class="error-title">Enlace inválido o expirado</div>
                    <div class="error-subtitle">Verifique el enlace recibido por email, o escríbanos.</div>
                    ${mensajeDebug ? `<p style="color:#ff5555; margin-top:20px; font-size:0.8em; font-family:monospace;">${mensajeDebug}</p>` : ''}
                </div>
            `;
        }

        function renderPanel(datos) {
            const app = document.getElementById('app');
            
            let htmlAlternativas = '';
            if (datos.servidor.alternativas && datos.servidor.alternativas.length > 0) {
                let urlsHtml = datos.servidor.alternativas.map(url => 
                    `<span class="alt-url" onclick="copiarTexto('${url}', this)">${url}</span>`
                ).join('');
                
                htmlAlternativas = `
                    <div class="alt-box">
                        <p class="alt-text">Tu operador bloquea la dirección habitual: esta sí funciona. Si viajas o usas VPN, usa una de las alternativas.</p>
                        <span class="alt-label">Direcciones Alternativas</span>
                        ${urlsHtml}
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="header">
                    <div><span style="font-size: 0.8em; color: #888;">PLAN</span><br><span class="plan-name">${datos.plan}</span></div>
                    <div style="text-align: right;"><span style="font-size: 0.8em; color: #888;">EXPIRA EL</span><br><span class="expira">${datos.expira}</span></div>
                </div>
                <div class="section-title">| ${datos.servidor.nombre}</div>
                <div class="subtitle">Móvil, PC, box</div>
                <div class="field"><label>HOST</label><input type="text" value="${datos.servidor.principal}" readonly onclick="copiarInput(this)"></div>
                <div class="field"><label>USUARIO</label><input type="text" value="${datos.xtream.usuario}" readonly onclick="copiarInput(this)"></div>
                <div class="field"><label>CONTRASEÑA</label><input type="text" value="${datos.xtream.contrasena}" readonly onclick="copiarInput(this)"></div>
                ${htmlAlternativas}
                <div class="section-title">| Smarters Pro</div>
                <div class="subtitle">LG, Samsung, Android TV, Firestick</div>
                <div class="field"><label>SERVIDOR</label><input type="text" value="${datos.servidor.principal}" readonly onclick="copiarInput(this)"></div>
                <div class="field"><label>USUARIO</label><input type="text" value="${datos.smarters.usuario}" readonly onclick="copiarInput(this)"></div>
                <div class="field"><label>CONTRASEÑA</label><input type="text" value="${datos.smarters.contrasena}" readonly onclick="copiarInput(this)"></div>
                <div class="section-title">| Enlace M3U</div>
                <div class="subtitle">VLC, TiviMate, Smart TV</div>
                <div class="field"><label>ENLACE M3U</label><input type="text" value="${datos.m3u}" readonly onclick="copiarInput(this)"></div>
            `;
        }

        window.copiarInput = function(input) {
            input.select();
            document.execCommand('copy');
            const colorOriginal = input.style.borderColor;
            input.style.borderColor = '#f5b041';
            setTimeout(() => input.style.borderColor = colorOriginal, 500);
        };

        window.copiarTexto = function(texto, elemento) {
            navigator.clipboard.writeText(texto).then(() => {
                const bgOriginal = elemento.style.backgroundColor;
                elemento.style.backgroundColor = '#f5b041';
                elemento.style.color = '#000';
                setTimeout(() => {
                    elemento.style.backgroundColor = bgOriginal;
                    elemento.style.color = '#4a90e2';
                }, 500);
            });
        };

        init();
    </script>
</body>
</html>
